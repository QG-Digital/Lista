<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hub de Aplicativos - QG Digital</title>

  <!-- CSS externo (pasta css) -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- TOCHA -->
  <label class="torch-container">
    <input class="torch-checkbox" checked="checked" type="checkbox" />
    <div class="torch">
      <div class="head">
        <div class="face top"><div></div><div></div><div></div><div></div></div>
        <div class="face left"><div></div><div></div><div></div><div></div></div>
        <div class="face right"><div></div><div></div><div></div><div></div></div>
      </div>
      <div class="stick">
        <div class="side side-left">
          <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
          <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
        </div>
        <div class="side side-right">
          <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
          <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
        </div>
      </div>
    </div>
  </label>

  <!-- BOTÕES DOS APPS -->
  <div class="apps-container">
    
    <!-- LocalInsta -->
    <div class="app-group">
      <a href="https://github.com/QG-Digital/LocalInsta/releases/tag/business-tools" class="app-pill localinsta" target="_blank">
        <div class="app-logo">L</div>
        <div class="app-name">Local<span>Insta</span></div>
      </a>
      <div class="downloads-counter"><span id="downloads-localinsta"></span> downloads</div>
    </div>

    <!-- Solário -->
    <div class="app-group">
      <a href="https://github.com/QG-Digital/Solario/releases/tag/Instalador" class="app-pill solario" target="_blank">
        <div class="app-logo">S</div>
        <div class="app-name">Solário <span>App</span></div>
      </a>
      <div class="downloads-counter"><span id="downloads-solario"></span> downloads</div>
    </div>

    <!-- API DeepSeek -->
    <div class="app-group">
      <a href="https://qg-digital.github.io/APIDEEPSEEK/" class="app-pill deepseek" target="_blank">
        <div class="app-logo">D</div>
        <div class="app-name">DeepSeek <span>API</span></div>
      </a>
      <div class="downloads-counter">Web App / Script</div>
    </div>

  </div>

  <!-- JS externo (pasta js) -->
  <script src="js/main.js"></script>
</body>
</html>
